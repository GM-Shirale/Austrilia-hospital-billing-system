# =====================================================================
# Default profile: runs with ONLY PostgreSQL.
#   Kafka  -> in-memory Spring events (switch with profile "kafka")
#   Redis  -> in-memory cache          (switch with profile "redis")
# Every secret can be overridden with an environment variable.
# =====================================================================
server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never

spring:
  application:
    name: hospital-billing-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/billing}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Ganga@123}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # Flyway owns the schema
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  cache:
    type: simple

  data:
    redis:
      repositories:
        enabled: false          # Redis is only used as a cache, never for repositories

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  # Spring AI. Works with OpenAI or any OpenAI-compatible API (Azure OpenAI, Groq, Ollama /v1 ...).
  # The placeholder key only lets the beans start; AI calls happen only when AI_ENABLED=true.
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2

app:
  ai:
    enabled: ${AI_ENABLED:false}   # false -> every AI feature uses its rule-based fallback
  zone-id: Australia/Sydney
  security:
    jwt:
      # Base64-encoded 256-bit key. ALWAYS override JWT_SECRET outside local dev.
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    registration:
      # Self-registration from the login screen. Set REGISTRATION_ENABLED=false in production.
      enabled: ${REGISTRATION_ENABLED:true}
      allowed-roles: RECEPTIONIST,DOCTOR,BILLING_OFFICER,LAB,PHARMACY,ADMIN
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  messaging:
    mode: in-memory             # in-memory | kafka
  billing:
    gst-rate: 0.10
  claims:
    mock-adapter:
      latency-ms: 500
      transient-failure-rate: 0.0   # set to 0.3 to watch the exponential back-off retries in the log
    retry:
      max-attempts: 4
      initial-delay-ms: 500
      multiplier: 2.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  pattern:
    level: "%5p [%X{correlationId:-}] [tenant=%X{tenantId:-}]"
  level:
    com.hospital.billing: INFO
    org.hibernate.SQL: WARN
